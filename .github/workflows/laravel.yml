on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Connect and Deploy
        run: |
          sshpass -p "${{ secrets.SSH_PASSWORD }}" ssh -o StrictHostKeyChecking=no -p 1985 "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}" << 'EOF'
            # Step 1: Navigate to the /opt directory
            cd /opt

            # Step 2: Clone the latest repository
            if [ -d "cover-link-admin-portal" ]; then
              echo "Directory already exists. Removing..."
              rm -rf cover-link-admin-portal
            fi
            git clone https://flanchoooo:${{ secrets.TOKEN }}@github.com/CoverLink-Zimbabwe/cover-link-admin-portal

            # Step 3: Navigate to the project directory
            cd cover-link-admin-portal

            git checkout main
            git pull origin main

            # Step 4: Stop, remove, and clean Docker resources
            docker stop cover-link-admin-portal || true
            docker rm cover-link-admin-portal || true
            docker rmi cover-link-admin-portal || true

            # Step 5: Build and run the Docker container
            docker build -t cover-link-admin-portal .
            docker run -d -p 8811:8080 --name=cover-link-admin-portal --restart=always cover-link-admin-portal

            # Step 6: Clean up cloned repository
            cd /opt
            rm -rf cover-link-admin-portal

            echo "Deployment completed successfully."
          EOF
